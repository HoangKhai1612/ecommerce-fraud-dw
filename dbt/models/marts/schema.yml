version: 2

models:

  # ============================================================
  # FACT: TRANSACTIONS
  # ============================================================
  - name: fact_transactions
    description: >
      Central fact table containing one row per transaction,
      combining transaction attributes with available identity information.

    columns:

      - name: transaction_key
        description: "Surrogate key generated by the Data Warehouse."
        data_tests:
          - not_null
          - unique

      - name: transaction_id
        description: "Original transaction identifier from the source dataset."
        data_tests:
          - not_null
          - unique

      - name: is_fraud
        description: "Fraud target label: 0 = legitimate, 1 = fraud."
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: transaction_amt
        description: "Transaction amount."
        data_tests:
          - not_null

      - name: product_key
        description: "Foreign key referencing dim_product."
        data_tests:
          - relationships:
              to: ref('dim_product')
              field: product_key

      - name: device_key
        description: "Foreign key referencing dim_device."
        data_tests:
          - relationships:
              to: ref('dim_device')
              field: device_key


  # ============================================================
  # DIMENSION: PRODUCT
  # ============================================================
  - name: dim_product
    description: >
      Product dimension at the product_cd and card4 grain.
      Each row represents a unique combination of product category
      and card type.

    columns:

      - name: product_key
        description: "Surrogate key of the product dimension."
        data_tests:
          - not_null
          - unique

      - name: product_cd
        description: "Product category code."
        data_tests:
          - not_null


  # ============================================================
  # DIMENSION: DEVICE
  # ============================================================
  - name: dim_device
    description: >
      Device dimension at the device_type and device_info grain.
      Each row represents a unique combination of device type
      and device information.

    columns:

      - name: device_key
        description: "Surrogate key of the device dimension."
        data_tests:
          - not_null
          - unique

      - name: device_type
        description: "Device type."
        data_tests:
          - not_null


  # ============================================================
  # DIMENSION: DATE
  # ============================================================
  - name: dim_date
    description: >
      Relative date dimension derived from TransactionDT in the
      IEEE-CIS Fraud Detection dataset. Since TransactionDT represents
      elapsed time rather than an absolute calendar date, this dimension
      uses relative transaction days.

    columns:

      - name: date_key
        description: "Surrogate key representing the relative transaction day."
        data_tests:
          - not_null
          - unique

      - name: transaction_day
        description: >
          Relative transaction day calculated from TransactionDT,
          ranging from day 1 to day 183.
        data_tests:
          - not_null

      - name: day_of_week
        description: >
          Relative day-of-week index derived from the transaction day.

      - name: week_number
        description: >
          Relative week number derived from the transaction day.