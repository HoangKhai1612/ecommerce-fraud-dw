version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fraud_dw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_fraud_dw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce_fraud_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud_dw_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_dw_api
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_fraud_dw}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./data:/app/data
      - ./ml/saved_models:/app/ml/saved_models
    networks:
      - fraud_dw_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Metabase BI dashboard (Phase 20)
  # - Application metadata is stored in the dedicated `metabase_db` database
  #   on the Windows PostgreSQL instance (persistent, recommended setup) —
  #   no local H2 file is used when MB_DB_* variables are set.
  # - Metabase reaches PostgreSQL through host.docker.internal:5432, the same
  #   pattern the airflow service uses. The reachable PostgreSQL instance is
  #   the Windows PostgreSQL 18.3 server that hosts the full Data Warehouse
  #   (ecommerce_fraud_dw with marts.*), NOT the `postgres` service container
  #   (which holds a separate docker-local database).
  metabase:
    image: metabase/metabase:v0.49.0
    container_name: fraud_dw_metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_HOST: host.docker.internal
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-postgres}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${METABASE_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fraud_dw_network

  # Optional: Ollama for local LLM (uncomment if using local LLM)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: fraud_dw_ollama
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_NUM_GPU: 0  # Set to 1 if GPU available
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - fraud_dw_network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${API_DATABASE_URL}
    restart: unless-stopped

volumes:
  postgres_data:
  # ollama_data:

networks:
  fraud_dw_network:
    driver: bridge
